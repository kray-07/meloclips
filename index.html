<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeloClips - Futbol Klipleri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white min-h-screen font-sans flex flex-col justify-between selection:bg-white selection:text-black">

    <!-- Header / Navbar -->
    <header class="border-b border-neutral-800 bg-black/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white rounded-md flex items-center justify-center font-bold text-black text-sm">MC</div>
                <h1 class="text-lg font-bold tracking-wider">MELOCLIPS</h1>
            </div>
            <div class="flex items-center gap-3">
                <div id="socialLinksContainer" class="flex items-center gap-2">
                    <a href="#" id="navYoutube" target="_blank" class="w-8 h-8 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center hover:bg-white hover:text-black transition text-sm"><i class="fab fa-youtube"></i></a>
                    <a href="#" id="navInstagram" target="_blank" class="w-8 h-8 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center hover:bg-white hover:text-black transition text-sm"><i class="fab fa-instagram"></i></a>
                </div>
                <button onclick="openAdminModal()" class="px-3 py-1.5 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-300 hover:bg-white hover:text-black transition text-xs font-semibold flex items-center gap-1.5">
                    <i class="fas fa-lock text-[10px]"></i> Yönetici
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="max-w-6xl mx-auto px-4 py-10 text-center">
        <span class="bg-neutral-900 text-neutral-400 text-[11px] px-3 py-1 rounded-full border border-neutral-800 uppercase tracking-widest font-mono">Arşiv & Klipler</span>
        <h2 class="text-3xl md:text-5xl font-black mt-4 mb-3 tracking-tight">Özel Futbol Klipleri</h2>
        <p class="text-neutral-500 max-w-md mx-auto text-sm">
            Edits ve paylaşımlarınız için yüksek kaliteli futbol video arşivi.
        </p>
    </section>

    <!-- Kategori Filtreleri -->
    <div class="max-w-6xl mx-auto px-4 mb-8 overflow-x-auto">
        <div class="flex gap-2 min-w-max pb-2">
            <button onclick="filterClips('Tümü')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold bg-white text-black transition">Tümü</button>
            <button onclick="filterClips('Goller')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition">Goller</button>
            <button onclick="filterClips('Çalımlar')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition">Çalımlar</button>
            <button onclick="filterClips('Kurtarışlar')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition">Kurtarışlar</button>
            <button onclick="filterClips('Viral')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition">Viral</button>
        </div>
    </div>

    <!-- Klip Galerisi GRID -->
    <main class="max-w-6xl mx-auto px-4 mb-20 flex-1 w-full">
        <div id="clipGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <p class="text-neutral-600 col-span-full text-center py-12 text-sm font-mono">Yükleniyor...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-900 py-6 text-center text-xs text-neutral-600">
        &copy; 2026 MeloClips. Tüm hakları saklıdır.
    </footer>

    <!-- Yönetici Giriş / Panel Modalı -->
    <div id="adminModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-neutral-950 border border-neutral-800 rounded-2xl p-6 w-full max-w-md relative">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-neutral-500 hover:text-white">
                <i class="fas fa-times text-base"></i>
            </button>

            <!-- Giriş Ekranı -->
            <div id="loginSection">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-lock text-white text-sm"></i> Yönetici Girişi
                </h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] text-neutral-400 mb-1 font-mono">Şifre</label>
                        <input type="password" id="adminPassword" placeholder="Şifrenizi girin" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-2.5 text-sm focus:outline-none focus:border-white text-white">
                    </div>
                    <button onclick="checkAdminLogin()" class="w-full bg-white text-black font-bold py-2.5 rounded-xl transition text-sm hover:bg-neutral-200">
                        Giriş Yap
                    </button>
                </div>
            </div>

            <!-- Yönetim Paneli -->
            <div id="dashboardSection" class="hidden space-y-5 max-h-[80vh] overflow-y-auto pr-1">
                <div class="flex items-center justify-between border-b border-neutral-900 pb-3">
                    <h3 class="text-lg font-bold flex items-center gap-2">
                        <i class="fas fa-sliders text-white text-sm"></i> Yönetim Paneli
                    </h3>
                    <button onclick="logoutAdmin()" class="text-xs text-red-400 hover:underline">Çıkış Yap</button>
                </div>

                <!-- 1. Sosyal Medya Ayarları -->
                <div class="bg-neutral-900/50 p-3.5 rounded-xl border border-neutral-800/60 space-y-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-neutral-400 font-mono">Sosyal Medya Linkleri</h4>
                    <div>
                        <label class="block text-[10px] text-neutral-500 mb-1">YouTube Kanal URL</label>
                        <input type="url" id="settingYoutube" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-white">
                    </div>
                    <div>
                        <label class="block text-[10px] text-neutral-500 mb-1">Instagram Kanal URL</label>
                        <input type="url" id="settingInstagram" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-white">
                    </div>
                    <button onclick="saveSocialLinks()" class="w-full bg-neutral-800 hover:bg-neutral-700 text-white font-semibold py-2 rounded-lg text-xs transition">
                        Linkleri Güncelle
                    </button>
                </div>

                <!-- 2. Klip Ekleme Formu -->
                <div class="bg-neutral-900/50 p-3.5 rounded-xl border border-neutral-800/60 space-y-3">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-neutral-400 font-mono">Yeni Klip Ekle (Galeriden)</h4>
                    <form id="addClipForm" onsubmit="uploadAndSaveClip(event)" class="space-y-3">
                        <div>
                            <label class="block text-[10px] text-neutral-500 mb-1">Klip Başlığı</label>
                            <input type="text" id="clipTitle" required placeholder="Örn: Anderson Talisca Özel Edits" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-white">
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-500 mb-1">Kategori</label>
                            <select id="clipCategory" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-white">
                                <option value="Goller">Goller</option>
                                <option value="Çalımlar">Çalımlar</option>
                                <option value="Kurtarışlar">Kurtarışlar</option>
                                <option value="Viral">Viral</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-500 mb-1">Kapak Fotoğrafı Seç (Galeriden / Cihazdan)</label>
                            <input type="file" id="clipThumbnailFile" accept="image/*" required class="w-full text-xs text-neutral-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-white hover:file:bg-neutral-700">
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-500 mb-1">Video Dosyası Seç (Galeriden / Cihazdan MP4)</label>
                            <input type="file" id="clipVideoFile" accept="video/mp4,video/webm" required class="w-full text-xs text-neutral-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neutral-800 file:text-white hover:file:bg-neutral-700">
                        </div>
                        <button type="submit" id="saveClipBtn" class="w-full bg-white hover:bg-neutral-200 text-black font-bold py-2.5 rounded-xl transition text-xs mt-1">
                            Dosyaları Yükle ve Yayınla
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Kodları -->
    <script>
        const SUPABASE_URL = "https://ybhvvxbyxkheiibnatoz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliaHZ2eGJ5eGtoZWlpYm5hdG96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTU2MDQsImV4cCI6MjEwNzg5MTYwNH0.qp0J6kUdAlrx91bujbR9s7OGHytZQhNBEAu9k7gF6iY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allClips = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchClips();
            fetchSettings();
        });

        async function fetchClips() {
            const { data, error } = await supabaseClient
                .from('clips')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Klipler yüklenemedi:", error);
                document.getElementById('clipGrid').innerHTML = '<p class="text-neutral-500 col-span-full text-center text-xs">Klipler yüklenirken bir hata oluştu.</p>';
                return;
            }

            allClips = data || [];
            renderClips(allClips);
        }

        async function fetchSettings() {
            const { data, error } = await supabaseClient
                .from('settings')
                .select('*');

            if (!error && data) {
                data.forEach(item => {
                    if (item.key === 'youtube') {
                        document.getElementById('navYoutube').href = item.value;
                        document.getElementById('settingYoutube').value = item.value;
                    }
                    if (item.key === 'instagram') {
                        document.getElementById('navInstagram').href = item.value;
                        document.getElementById('settingInstagram').value = item.value;
                    }
                });
            }
        }

        function renderClips(clips) {
            const grid = document.getElementById('clipGrid');
            if (clips.length === 0) {
                grid.innerHTML = '<p class="text-neutral-600 col-span-full text-center py-12 text-xs font-mono">Henüz klip eklenmemiş.</p>';
                return;
            }

            grid.innerHTML = '';
            clips.forEach(clip => {
                grid.innerHTML += `
                    <div class="bg-neutral-950 border border-neutral-900 rounded-2xl overflow-hidden hover:border-neutral-700 transition flex flex-col justify-between group">
                        <div>
                            <div class="relative aspect-video bg-neutral-900">
                                <img src="${clip.thumbnail}" alt="${clip.title}" class="w-full h-full object-cover">
                                <span class="absolute top-2 left-2 bg-black/80 backdrop-blur text-white text-[10px] px-2.5 py-1 rounded-md border border-neutral-800 font-mono uppercase tracking-wider">
                                    ${clip.category}
                                </span>
                            </div>
                            <div class="p-4">
                                <h3 class="font-semibold text-sm line-clamp-1 text-neutral-200 group-hover:text-white transition">${clip.title}</h3>
                            </div>
                        </div>
                        <div class="p-4 pt-0 flex items-center justify-between border-t border-neutral-900/60 mt-2">
                            <button onclick="likeClip(${clip.id}, ${clip.likes})" class="text-xs text-neutral-500 hover:text-white transition flex items-center gap-1.5 font-mono">
                                <i class="fas fa-heart text-neutral-400"></i> <span>${clip.likes || 0}</span>
                            </button>
                            <a href="${clip.video_url}" target="_blank" download class="bg-neutral-900 hover:bg-white hover:text-black border border-neutral-800 text-neutral-300 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                                <i class="fas fa-download text-[10px]"></i> İndir
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function filterClips(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-lg text-xs font-semibold bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-white transition";
            });
            event.target.className = "cat-btn px-4 py-2 rounded-lg text-xs font-semibold bg-white text-black transition";

            if (category === 'Tümü') {
                renderClips(allClips);
            } else {
                const filtered = allClips.filter(c => c.category === category);
                renderClips(filtered);
            }
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function checkAdminLogin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "147258369melo") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                alert("Hatalı şifre!");
            }
        }

        function logoutAdmin() {
            document.getElementById('adminPassword').value = "";
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        async function saveSocialLinks() {
            const yt = document.getElementById('settingYoutube').value;
            const ig = document.getElementById('settingInstagram').value;

            const { error } = await supabaseClient.from('settings').upsert([
                { key: 'youtube', value: yt },
                { key: 'instagram', value: ig }
            ], { onConflict: 'key' });

            if (error) {
                alert("Hata: " + error.message);
            } else {
                alert("Sosyal medya linkleri güncellendi!");
                fetchSettings();
            }
        }

        async function uploadAndSaveClip(e) {
            e.preventDefault();
            const btn = document.getElementById('saveClipBtn');
            btn.innerText = "Dosyalar Yükleniyor...";
            btn.disabled = true;

            const title = document.getElementById('clipTitle').value;
            const category = document.getElementById('clipCategory').value;
            const thumbFile = document.getElementById('clipThumbnailFile').files[0];
            const videoFile = document.getElementById('clipVideoFile').files[0];

            try {
                const thumbFileName = 'thumb_' + Date.now() + '_' + thumbFile.name;
                const { error: thumbError } = await supabaseClient.storage
                    .from('media')
                    .upload(thumbFileName, thumbFile);

                if (thumbError) throw thumbError;

                const { data: { publicUrl: thumbPublicUrl } } = supabaseClient.storage
                    .from('media')
                    .getPublicUrl(thumbFileName);

                const videoFileName = 'video_' + Date.now() + '_' + videoFile.name;
                const { error: videoError } = await supabaseClient.storage
                    .from('media')
                    .upload(videoFileName, videoFile);

                if (videoError) throw videoError;

                const { data: { publicUrl: videoPublicUrl } } = supabaseClient.storage
                    .from('media')
                    .getPublicUrl(videoFileName);

                const { error: dbError } = await supabaseClient.from('clips').insert([{
                    title: title,
                    category: category,
                    thumbnail: thumbPublicUrl,
                    video_url: videoPublicUrl,
                    likes: 0
                }]);

                if (dbError) throw dbError;

                alert("Klip başarıyla yüklendi ve yayınlandı!");
                document.getElementById('addClipForm').reset();
                closeAdminModal();
                fetchClips();

            } catch (err) {
                alert("Yükleme sırasında hata oluştu: " + err.message);
            } finally {
                btn.innerText = "Dosyaları Yükle ve Yayınla";
                btn.disabled = false;
            }
        }

        async function likeClip(id, currentLikes) {
            const { error } = await supabaseClient
                .from('clips')
                .update({ likes: (currentLikes || 0) + 1 })
                .eq('id', id);

            if (!error) {
                fetchClips();
            }
        }
    </script>
</body>
</html>
